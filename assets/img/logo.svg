<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Newton's Apples Physics Society">
  <title>An apple encircled by Saturn's rings</title>
  <defs>
    <radialGradient id="na-apple" cx="36%" cy="26%" r="82%">
      <stop offset="0"    stop-color="#ff9c86"/>
      <stop offset="42%"  stop-color="#ee4058"/>
      <stop offset="100%" stop-color="#b01a3c"/>
    </radialGradient>
    <linearGradient id="na-ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#ffe6ad"/>
      <stop offset="42%"  stop-color="#f2c14e"/>
      <stop offset="100%" stop-color="#cf8f1f"/>
    </linearGradient>
    <linearGradient id="na-leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0"    stop-color="#2f9e4f"/>
      <stop offset="100%" stop-color="#86e58f"/>
    </linearGradient>
  </defs>

  <!-- rings, far side: dimmed so the apple reads as sitting in front -->
  <g transform="rotate(-18 32 37)" fill="none" stroke="url(#na-ring)"
     stroke-linecap="round" opacity=".5">
    <path d="M 2 37 A 30 9.6 0 0 1 62 37" stroke-width="3"/>
    <path d="M 8 37 A 24 7.4 0 0 1 56 37" stroke-width="1.7"/>
  </g>

  <!-- stem + leaf -->
  <path d="M 32 27 C 32.4 21 33.2 17 35.2 13.6" stroke="#8a5a30"
        stroke-width="3.1" stroke-linecap="round" fill="none"/>
  <path d="M 35.8 16.6 C 40.5 10.4 48.6 11 50.2 14.2 C 48.1 20.4 39.9 21.9 35.8 16.6 Z"
        fill="url(#na-leaf)"/>
  <path d="M 37.6 17.2 C 41.6 15.4 46.2 14.5 49.2 14.4" stroke="#1d7a3a"
        stroke-width="1" stroke-linecap="round" fill="none" opacity=".65"/>

  <!-- apple -->
  <path d="M 32 27
           C 29 21.5, 22 19.5, 17.5 23.5
           C 12 28, 11 36.5, 14.5 44.5
           C 17.5 51, 23 56, 28 56
           C 30 56, 31 55, 32 55
           C 33 55, 34 56, 36 56
           C 41 56, 46.5 51, 49.5 44.5
           C 53 36.5, 52 28, 46.5 23.5
           C 42 19.5, 35 21.5, 32 27 Z"
        fill="url(#na-apple)"/>
  <!-- gloss -->
  <ellipse cx="22.5" cy="34" rx="4.6" ry="7.6" fill="#fff" opacity=".3"
           transform="rotate(-24 22.5 34)"/>

  <!-- rings, near side: crosses in front of the apple -->
  <g transform="rotate(-18 32 37)" fill="none" stroke="url(#na-ring)" stroke-linecap="round">
    <path d="M 2 37 A 30 9.6 0 0 0 62 37" stroke-width="3"/>
    <path d="M 8 37 A 24 7.4 0 0 0 56 37" stroke-width="1.7" opacity=".9"/>
    <!-- a few ring particles, for fun -->
    <circle cx="59.5" cy="40.5" r="1.5" fill="#ffe6ad" stroke="none"/>
    <circle cx="5.5"  cy="33.5" r="1.2" fill="#ffe6ad" stroke="none"/>
  </g>

  <!-- sparkles -->
  <path d="M 0 -4.2 Q 0.7 -0.7 4.2 0 Q 0.7 0.7 0 4.2 Q -0.7 0.7 -4.2 0 Q -0.7 -0.7 0 -4.2 Z"
        fill="#ffe9a8" transform="translate(9 15) scale(.95)"/>
  <path d="M 0 -4.2 Q 0.7 -0.7 4.2 0 Q 0.7 0.7 0 4.2 Q -0.7 0.7 -4.2 0 Q -0.7 -0.7 0 -4.2 Z"
        fill="#ffe9a8" transform="translate(55 53) scale(.62)" opacity=".85"/>
</svg>
